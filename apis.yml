name: Mundi
description: Mundi is a digital cross-border trade finance platform for exporters,
  primarily connecting Mexican exporters with US importers. It provides non-recourse
  international factoring (invoice advances up to $10M USD / $200M MXN with rates from
  0.9% per month), foreign-exchange spot and hedging across 100+ currencies, purchase-order
  and revolving-line financing, multi-currency virtual US accounts and international
  payments/collections, and digital cargo insurance. Backed by Speedinvest and Union
  Square Ventures, Mundi operates a customer web application but publishes no public
  developer API, SDK, or documentation surface at this time.
